description = "Learn atomic facts tied to verified project source rather than full topic Markdown"

prompt = """
Learn reusable knowledge about {{args}} without editing source code.

1. Query existing FXMIND facts first: fxmind_query({ question: "{{args}}", budget: 1500 }).
2. Inspect only related project code. Identify independent facts (event, handler, config, guard, pitfall, rule), each with an exact source substring and a real project-relative path.
3. For each fact call fxmind_graph({ updateHtml: false, addFact: { topic, kind, text, path, evidence, symbols, events } }). The MCP validates evidence and stores a globally scoped, project-keyed atom.
4. Do not create or extend broad .fxmind/memory/<topic>.md files or invent sources. Keep existing Markdown intact.
5. Respond with factual atom count and source links in the user's language.

If MCP is unavailable, state that learning was not persisted; do not fake a successful save.
"""
