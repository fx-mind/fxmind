<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FiveM — Mapa mental</title>
  <style>
    :root {
      --bg: #000000;
      --panel: #09090b;
      --surface: rgba(255, 255, 255, 0.03);
      --surface-hover: rgba(255, 255, 255, 0.055);
      --border: rgba(255, 255, 255, 0.06);
      --border-strong: rgba(255, 255, 255, 0.1);
      --text: #fafafa;
      --muted: #a1a1aa;
      --muted-2: #71717a;
      --accent: #6366F1;
      --learned: #2DD4BF;
      --catalog: #71717A;
      --link: #6366F1;
      --highlight: #A855F7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .layout {
      display: grid;
      grid-template-columns: 272px 1fr;
      height: 100vh;
    }

    .sidebar {
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 20px 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0;
      scrollbar-width: thin;
      scrollbar-color: var(--border-strong) transparent;
    }

    .sidebar-header {
      padding-bottom: 18px;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .sidebar-brand-title {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .sidebar-logo {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      flex-shrink: 0;
      object-fit: cover;
    }

    .sidebar h1 {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .sidebar .subtitle {
      font-size: 11px;
      color: var(--muted-2);
      line-height: 1.55;
    }

    .sidebar .subtitle code {
      font-family: ui-monospace, "Cascadia Code", monospace;
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 4px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .sidebar-section {
      margin-bottom: 18px;
    }

    .section-title {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted-2);
      margin-bottom: 10px;
    }

    input[type="search"] {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      font-size: 12px;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    input[type="search"]::placeholder {
      color: var(--muted-2);
    }

    input[type="search"]:focus {
      outline: none;
      border-color: var(--border-strong);
      background: var(--surface-hover);
    }

    .filter-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .filter-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .filter-toggle:hover {
      background: var(--surface-hover);
      color: var(--text);
    }

    .filter-toggle input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
      pointer-events: none;
    }

    .toggle-track {
      position: relative;
      flex-shrink: 0;
      width: 30px;
      height: 17px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .toggle-thumb {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--muted-2);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .filter-toggle input:checked + .toggle-track {
      background: rgba(168, 85, 247, 0.18);
      border-color: rgba(168, 85, 247, 0.45);
    }

    .filter-toggle input:checked + .toggle-track .toggle-thumb {
      transform: translateX(13px);
      background: var(--catalog);
    }

    .filter-toggle input:checked ~ .filter-label,
    .filter-toggle:has(input:checked) {
      color: var(--text);
    }

    .legend {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--muted);
      padding: 4px 0;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot.learned { background: linear-gradient(135deg, #2DD4BF, #6366F1, #A855F7); }
    .dot.catalog { background: var(--catalog); }
    .dot.foreign { background: #F59E0B; }

    .stats {
      padding: 12px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .stat-chip {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border);
    }

    .stat-value {
      font-size: 15px;
      font-weight: 500;
      letter-spacing: -0.02em;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .stat-label {
      font-size: 10px;
      color: var(--muted-2);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .stat-footer {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      font-size: 10px;
      color: var(--muted-2);
      line-height: 1.5;
    }

    .detail {
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      min-height: 100px;
    }

    .detail h2 {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: -0.01em;
      margin-bottom: 10px;
      word-break: break-word;
      color: var(--text);
    }

    .detail p {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.55;
      margin-bottom: 6px;
    }

    .detail p strong {
      color: var(--muted-2);
      font-weight: 500;
    }

    .detail .badge {
      display: inline-block;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 4px;
      margin-bottom: 10px;
    }

    .badge.learned {
      background: rgba(45, 212, 191, 0.12);
      color: #5eead4;
      border: 1px solid rgba(45, 212, 191, 0.2);
    }

    .badge.catalog {
      background: rgba(168, 85, 247, 0.12);
      color: #c084fc;
      border: 1px solid rgba(168, 85, 247, 0.2);
    }

    .badge.foreign {
      background: rgba(245, 158, 11, 0.12);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.2);
    }

    .detail button {
      margin-top: 10px;
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--surface);
      color: var(--muted);
      font-size: 11px;
      cursor: pointer;
      transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
    }

    .detail button:hover {
      border-color: var(--border-strong);
      color: var(--text);
      background: var(--surface-hover);
    }

    .empty-detail {
      font-size: 11px;
      color: var(--muted-2);
      line-height: 1.6;
    }

    .graph-stage {
      position: relative;
      min-height: 0;
      height: 100%;
      overflow: hidden;
      background: #000000;
    }

    #graph {
      position: absolute;
      inset: 0;
    }

    .graph-toolbar {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 3;
      display: flex;
      gap: 8px;
    }

    .graph-toolbar button {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(9, 9, 11, 0.85);
      color: var(--muted);
      font-size: 11px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
    }

    .graph-toolbar button:hover {
      border-color: var(--border-strong);
      color: var(--text);
      background: rgba(9, 9, 11, 0.95);
    }

    #graph-tooltip {
      position: absolute;
      pointer-events: none;
      z-index: 4;
      display: none;
      max-width: 280px;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--border-strong);
      background: rgba(9, 9, 11, 0.92);
      color: var(--text);
      font-size: 11px;
      font-weight: 500;
      line-height: 1.4;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      transform: translate(-50%, -100%);
      margin-top: -10px;
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <header class="sidebar-header">
        <div class="sidebar-brand">
          <div class="sidebar-brand-title">
            <img
              src="https://avatars.githubusercontent.com/u/296747387?s=200&v=4"
              alt="fxmind logo"
              class="sidebar-logo"
            />
            <h1>FxMind</h1>
          </div>
        </div>
        <p class="subtitle">Tópicos aprendidos via <code>/fxmind learn</code></p>
      </header>

      <section class="sidebar-section">
        <input type="search" id="search" placeholder="Buscar tópico…" />
      </section>

      <section class="sidebar-section">
        <div class="section-title">Filtros</div>
        <div class="filter-list">
          <label class="filter-toggle">
            <span class="filter-label">Órfãos</span>
            <input type="checkbox" id="toggle-orphans" checked />
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
          </label>
          <label class="filter-toggle">
            <span class="filter-label">Só aprendidos</span>
            <input type="checkbox" id="toggle-learned-only" />
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
          </label>
          <label class="filter-toggle">
            <span class="filter-label">Ocultar nomes</span>
            <input type="checkbox" id="toggle-hide-names" checked />
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
          </label>
        </div>
      </section>

      <section class="sidebar-section">
        <div class="section-title">Grupos</div>
        <div class="legend">
          <div class="legend-item"><span class="dot learned"></span> Com ligação</div>
          <div class="legend-item"><span class="dot catalog"></span> Órfão</div>
          <div class="legend-item"><span class="dot foreign"></span> Outro projeto</div>
        </div>
      </section>

      <section class="sidebar-section stats" id="stats"></section>

      <section class="detail" id="detail">
        <p class="empty-detail">Selecione um nó para ver detalhes.</p>
      </section>
    </aside>

    <div class="graph-stage">
      <div class="graph-toolbar">
        <button type="button" id="btn-fit">Centralizar</button>
      </div>
      <div id="graph-tooltip" role="tooltip"></div>
      <div id="graph"></div>
    </div>
  </div>

  <script src="https://unpkg.com/force-graph@1.43.4/dist/force-graph.min.js"></script>
  <script>
    const GRAPH_DATA = /*__GRAPH_DATA__*/;

    const GENERIC_TOPIC_TOKENS = new Set([
      "config", "script", "module", "system", "core", "main", "utils", "util",
    ]);

    function stripAccents(value) {
      return String(value || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
    }

    function singularizeToken(token) {
      if (!token || token.length <= 3) return token;
      if (token.endsWith("oes")) return `${token.slice(0, -3)}ao`;
      if (token.endsWith("ais")) return token.slice(0, -1);
      if (token.endsWith("s") && !token.endsWith("ss")) return token.slice(0, -1);
      return token;
    }

    function canonicalTopicKey(value) {
      return stripAccents(String(value || "").toLowerCase())
        .replace(/[^a-z0-9]+/g, " ")
        .trim()
        .split(/\s+/)
        .filter(Boolean)
        .map(singularizeToken)
        .filter((token) => token && !GENERIC_TOPIC_TOKENS.has(token))
        .join(" ");
    }

    function topicTokens(value) {
      const keys = new Set();
      const canonical = canonicalTopicKey(value);
      if (canonical) keys.add(canonical);
      stripAccents(String(value || "").toLowerCase())
        .split(/[^a-z0-9]+/)
        .filter((token) => token.length >= 3 && !GENERIC_TOPIC_TOKENS.has(token))
        .forEach((token) => keys.add(singularizeToken(token)));
      return keys;
    }

    function collectTopicKeys(node) {
      const keys = new Set();
      [node.id, node.name, node.triggers, node.searchHints].forEach((field) => {
        topicTokens(field).forEach((key) => keys.add(key));
      });
      return keys;
    }

    function topicsOverlap(aKeys, bKeys) {
      for (const key of aKeys) {
        if (bKeys.has(key)) return true;
      }
      return false;
    }

    (function sanitizeGraphData() {
      const nodes = GRAPH_DATA.nodes || [];
      const learnedKeys = new Set();
      nodes
        .filter((node) => node.group === "learned")
        .forEach((node) => collectTopicKeys(node).forEach((key) => learnedKeys.add(key)));

      GRAPH_DATA.nodes = nodes.filter((node) => {
        if (node.group !== "catalog") return true;
        const catalogKeys = collectTopicKeys(node);
        return !topicsOverlap(catalogKeys, learnedKeys);
      });

      const catalogIds = new Set(
        GRAPH_DATA.nodes.filter((n) => n.group === "catalog").map((n) => n.id),
      );
      if (!GRAPH_DATA.links) GRAPH_DATA.links = [];
      GRAPH_DATA.links = GRAPH_DATA.links.filter((link) => {
        const src = link.source?.id ?? link.source;
        const tgt = link.target?.id ?? link.target;
        return !catalogIds.has(src) && !catalogIds.has(tgt) && link.type !== "catalog-hint";
      });
    })();

    const COLORS = {
      learned: "#2DD4BF",
      catalog: "#71717A",
      orphan: "#71717A",
      foreign: "#F59E0B",
      highlight: "#A855F7",
      dim: "#3a3a50",
      link: "#6366F1",
      linkDim: "rgba(99, 102, 241, 0.12)",
    };

    const LINK_TYPE_COLORS = {
      "event-flow": "#22D3EE",
      "shared-resource": "#4ADE80",
      "shared-path": "#60A5FA",
      "shared-symbol": "#A78BFA",
      "cross-mention": "#F472B6",
      "domain-related": "#818CF8",
      "cross-project": "#F59E0B",
    };

    const VIVID_PALETTE = [
      "#60A5FA", "#22D3EE", "#A78BFA", "#F472B6",
      "#4ADE80", "#38BDF8", "#818CF8", "#C084FC",
    ];

    const NODE_LEARNED_BASE = 4;
    const NODE_CATALOG_BASE = 3;
    const NODE_LEARNED_K = 0.85;
    const NODE_CATALOG_K = 0.55;
    const LABEL_ZOOM_ALL = 1.15;
    const LABEL_TOP_K = 24;
    const SEARCH_DEBOUNCE_MS = 200;

    const searchInput = document.getElementById("search");
    const toggleOrphans = document.getElementById("toggle-orphans");
    const toggleLearnedOnly = document.getElementById("toggle-learned-only");
    const toggleHideNames = document.getElementById("toggle-hide-names");
    const statsEl = document.getElementById("stats");
    const detailEl = document.getElementById("detail");
    const tooltipEl = document.getElementById("graph-tooltip");
    const btnFit = document.getElementById("btn-fit");

    let selectedNode = null;
    let hoverNode = null;
    let highlightNodes = new Set();
    let highlightLinks = new Set();
    let adjacency = new Map();
    let linkedNodeIds = new Set();
    let labelPriorityIds = new Set();
    let currentGlobalScale = 1;
    let searchDebounceTimer = null;
    let fitPending = false;

    const spriteCache = new Map();

    function nodeId(value) {
      return value?.id ?? value;
    }

    function effectiveTokens(node) {
      if ((node.tokens || 0) > 0) return node.tokens;
      const hint = `${node.triggers || ""} ${node.searchHints || ""}`.trim();
      return hint ? Math.round(hint.length / 4) : 0;
    }

    function nodeRadius(node) {
      const tokens = Math.max(0, effectiveTokens(node));
      const base = node.group === "learned" ? NODE_LEARNED_BASE : NODE_CATALOG_BASE;
      const scale = node.group === "learned" ? NODE_LEARNED_K : NODE_CATALOG_K;
      const max = node.group === "learned" ? 18 : 10;
      return Math.max(base, Math.min(max, base + scale * Math.sqrt(tokens)));
    }

    function paletteColor(id) {
      let hash = 0;
      for (let i = 0; i < id.length; i += 1) {
        hash = (hash << 5) - hash + id.charCodeAt(i);
      }
      return VIVID_PALETTE[Math.abs(hash) % VIVID_PALETTE.length];
    }

    function nodeHasLinks(node) {
      return linkedNodeIds.has(node.id);
    }

    function nodeColor(node) {
      if (selectedNode && node.id === selectedNode.id) return COLORS.highlight;
      if (hoverNode && node.id === hoverNode.id) return COLORS.highlight;
      if (highlightNodes.size && !highlightNodes.has(node.id)) return COLORS.dim;
      if (node.group === "foreign") return COLORS.foreign;
      if (node.group === "catalog") return COLORS.catalog;
      return nodeHasLinks(node) ? paletteColor(node.id) : COLORS.orphan;
    }

    function buildAdjacency(links) {
      adjacency = new Map();
      linkedNodeIds = new Set();
      for (const link of links) {
        const src = nodeId(link.source);
        const tgt = nodeId(link.target);
        linkedNodeIds.add(src);
        linkedNodeIds.add(tgt);
        if (!adjacency.has(src)) adjacency.set(src, { neighbors: new Set(), links: [] });
        if (!adjacency.has(tgt)) adjacency.set(tgt, { neighbors: new Set(), links: [] });
        adjacency.get(src).neighbors.add(tgt);
        adjacency.get(tgt).neighbors.add(src);
        adjacency.get(src).links.push(link);
        adjacency.get(tgt).links.push(link);
      }
    }

    function computeLabelPriority(nodes, links) {
      const degrees = new Map();
      links.forEach((link) => {
        const src = nodeId(link.source);
        const tgt = nodeId(link.target);
        degrees.set(src, (degrees.get(src) || 0) + 1);
        degrees.set(tgt, (degrees.get(tgt) || 0) + 1);
      });
      const ranked = nodes
        .map((node) => ({
          id: node.id,
          score: (degrees.get(node.id) || 0) * 10 + effectiveTokens(node),
        }))
        .sort((a, b) => b.score - a.score)
        .slice(0, LABEL_TOP_K);
      labelPriorityIds = new Set(ranked.map((row) => row.id));
    }

    function shouldDrawLabel(node) {
      const inFocus =
        (selectedNode && node.id === selectedNode.id) ||
        (hoverNode && node.id === hoverNode.id) ||
        highlightNodes.has(node.id);

      if (toggleHideNames.checked) {
        return inFocus;
      }

      if (inFocus) return true;
      if (currentGlobalScale >= LABEL_ZOOM_ALL) return true;
      return labelPriorityIds.has(node.id);
    }

    function getNodeSprite(color, radiusPx, glow) {
      const key = `${color}|${Math.round(radiusPx)}|${glow ? 1 : 0}`;
      let entry = spriteCache.get(key);
      if (entry) return entry;

      const pad = glow ? Math.ceil(radiusPx * 1.8) : 2;
      const size = Math.ceil(radiusPx * 2 + pad * 2);
      const canvas = document.createElement("canvas");
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext("2d");
      const cx = size / 2;
      const cy = size / 2;

      if (glow) {
        const grd = ctx.createRadialGradient(cx, cy, radiusPx * 0.2, cx, cy, radiusPx * 1.65);
        grd.addColorStop(0, colorWithAlpha(color, 0.55));
        grd.addColorStop(0.45, colorWithAlpha(color, 0.22));
        grd.addColorStop(1, colorWithAlpha(color, 0));
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(cx, cy, radiusPx * 1.65, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(cx, cy, radiusPx, 0, Math.PI * 2);
        ctx.fill();
      }

      entry = { canvas, half: size / 2 };
      spriteCache.set(key, entry);
      return entry;
    }

    function colorWithAlpha(hex, alpha) {
      const value = hex.replace("#", "");
      const r = parseInt(value.slice(0, 2), 16);
      const g = parseInt(value.slice(2, 4), 16);
      const b = parseInt(value.slice(4, 6), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function drawNodeLabel(ctx, node, radius, globalScale) {
      if (!shouldDrawLabel(node)) return;

      const fontSize = Math.max(10, Math.min(14, 11 / globalScale));
      ctx.font = `600 ${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      const y = radius + 4 / globalScale;
      const dimmed = highlightNodes.size > 0 && !highlightNodes.has(node.id);

      ctx.lineWidth = 3 / globalScale;
      ctx.strokeStyle = "rgba(0, 0, 0, 0.85)";
      ctx.fillStyle = dimmed ? "rgba(250, 250, 250, 0.45)" : "#fafafa";
      ctx.strokeText(node.name, node.x, y);
      ctx.fillText(node.name, node.x, y);
    }

    function paintNode(node, ctx, globalScale) {
      currentGlobalScale = globalScale;
      const radius = nodeRadius(node) / globalScale;
      const color = nodeColor(node);
      const isFocus =
        (selectedNode && node.id === selectedNode.id) ||
        (hoverNode && node.id === hoverNode.id);
      const dimmed = highlightNodes.size > 0 && !highlightNodes.has(node.id);

      const glowSprite = getNodeSprite(color, radius * (isFocus ? 1.15 : 1), true);
      ctx.globalAlpha = dimmed ? 0.35 : 1;
      ctx.drawImage(
        glowSprite.canvas,
        node.x - glowSprite.half,
        node.y - glowSprite.half,
      );

      const coreSprite = getNodeSprite(color, radius * (isFocus ? 1.08 : 1), false);
      ctx.globalAlpha = dimmed ? 0.5 : 1;
      ctx.drawImage(
        coreSprite.canvas,
        node.x - coreSprite.half,
        node.y - coreSprite.half,
      );
      ctx.globalAlpha = 1;

      drawNodeLabel(ctx, node, radius, globalScale);
    }

    function paintPointerArea(node, color, ctx) {
      const scale = Math.max(currentGlobalScale, 0.05);
      const radius = (nodeRadius(node) + 10) / scale;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(node.x, node.y, radius, 0, 2 * Math.PI, false);
      ctx.fill();
    }

    function linkColor(link) {
      const highlighted = highlightLinks.has(link);
      const dimmed = highlightLinks.size > 0 && !highlighted;
      if (dimmed) return COLORS.linkDim;
      if (highlighted) return LINK_TYPE_COLORS[link.type] || COLORS.link;
      return colorWithAlpha(LINK_TYPE_COLORS[link.type] || COLORS.link, 0.45);
    }

    function linkWidth(link) {
      const highlighted = highlightLinks.has(link);
      if (highlightLinks.size > 0 && !highlighted) return 0.35;
      return highlighted ? 2.2 : 0.85;
    }

    function layoutSpread(nodeCount) {
      const n = nodeCount || 1;
      return 90 + Math.sqrt(n) * 28;
    }

    function seedMindMapPositions2D(nodes, links) {
      const spread = layoutSpread(nodes.length);
      const degrees = new Map();
      links.forEach((link) => {
        const src = nodeId(link.source);
        const tgt = nodeId(link.target);
        degrees.set(src, (degrees.get(src) || 0) + 1);
        degrees.set(tgt, (degrees.get(tgt) || 0) + 1);
      });

      const connected = nodes
        .filter((node) => degrees.has(node.id))
        .sort((a, b) => (degrees.get(b.id) || 0) - (degrees.get(a.id) || 0));
      const orphans = nodes
        .filter((node) => !degrees.has(node.id))
        .sort((a, b) => a.name.localeCompare(b.name));

      const golden = Math.PI * (3 - Math.sqrt(5));

      function placeDisc(list, radius, startIndex) {
        const total = list.length + startIndex;
        list.forEach((node, index) => {
          const order = index + startIndex;
          const t = (order + 0.5) / total;
          const r = radius * Math.sqrt(t);
          const theta = golden * order;
          node.x = r * Math.cos(theta);
          node.y = r * Math.sin(theta);
        });
      }

      const center = connected[0] || nodes[0];
      if (center) {
        center.x = 0;
        center.y = 0;
      }

      placeDisc(connected.filter((node) => node !== center), spread * 0.38, 1);
      placeDisc(orphans, spread * 0.92, connected.length + 2);
    }

    function filteredData() {
      const query = searchInput.value.trim().toLowerCase();
      const showOrphans = toggleOrphans.checked;
      const learnedOnly = toggleLearnedOnly.checked;

      const nodes = GRAPH_DATA.nodes.filter((node) => {
        if (learnedOnly && node.group !== "learned") return false;
        if (!showOrphans && node.group === "catalog") return false;
        if (query && !node.name.toLowerCase().includes(query) && !node.id.includes(query)) {
          return false;
        }
        return true;
      });

      const nodeIds = new Set(nodes.map((node) => node.id));
      const links = GRAPH_DATA.links.filter(
        (link) => nodeIds.has(nodeId(link.source)) && nodeIds.has(nodeId(link.target)),
      );

      return { nodes, links };
    }

    function formatGeneratedAt(iso) {
      if (!iso) return "";
      try {
        return new Date(iso).toLocaleString("pt-BR");
      } catch {
        return iso;
      }
    }

    function renderDetail(node) {
      if (!node) {
        detailEl.innerHTML = '<p class="empty-detail">Selecione um nó para ver detalhes.</p>';
        return;
      }

      const badgeClass = node.group === "learned" ? "learned" : node.group === "foreign" ? "foreign" : "catalog";
      const badgeLabel = node.group === "learned" ? "Aprendido" : node.group === "foreign" ? "Outro projeto" : "Catálogo (órfão)";

      detailEl.innerHTML = `
        <span class="badge ${badgeClass}">${badgeLabel}</span>
        <h2>${node.name}</h2>
        ${node.tokens ? `<p><strong>Tokens:</strong> ~${node.tokens.toLocaleString("pt-BR")}</p>` : ""}
        ${node.file ? `<p><strong>Arquivo:</strong> ${node.file}</p>` : ""}
        ${node.updated ? `<p><strong>Atualizado:</strong> ${node.updated}</p>` : ""}
        ${node.framework ? `<p><strong>Framework:</strong> ${node.framework}</p>` : ""}
        ${node.triggers ? `<p><strong>Triggers:</strong> ${node.triggers}</p>` : ""}
        ${node.projectName ? `<p><strong>Projeto:</strong> ${node.projectName}</p>` : ""}
        ${node.group === "catalog" ? `<p>Execute <code>/fxmind learn ${node.id}</code> para gerar a memória.</p>` : ""}
        ${node.file ? `<button type="button" id="copy-path">Copiar path</button>` : ""}
      `;

      const copyBtn = document.getElementById("copy-path");
      if (copyBtn) {
        copyBtn.addEventListener("click", () => {
          navigator.clipboard.writeText(node.file).then(() => {
            copyBtn.textContent = "Copiado!";
            setTimeout(() => { copyBtn.textContent = "Copiar path"; }, 1200);
          });
        });
      }
    }

    function updateStats(data) {
      const learned = data.nodes.filter((n) => n.group === "learned").length;
      const catalog = data.nodes.filter((n) => n.group === "catalog").length;
      const visibleTokens = data.nodes.reduce((sum, n) => sum + (n.tokens || 0), 0);
      const totalTokens = GRAPH_DATA.meta?.counts?.tokens || 0;
      const generated = formatGeneratedAt(GRAPH_DATA.meta?.generatedAt);
      const meta = GRAPH_DATA.meta?.counts || { learned: 0, catalog: 0, links: 0 };

      statsEl.innerHTML = `
        <div class="stat-grid">
          <div class="stat-chip">
            <span class="stat-value">${learned}</span>
            <span class="stat-label">Aprendidos</span>
          </div>
          <div class="stat-chip">
            <span class="stat-value">${catalog}</span>
            <span class="stat-label">Órfãos</span>
          </div>
          <div class="stat-chip">
            <span class="stat-value">${data.links.length}</span>
            <span class="stat-label">Links</span>
          </div>
          <div class="stat-chip">
            <span class="stat-value">~${visibleTokens.toLocaleString("pt-BR")}</span>
            <span class="stat-label">Tokens</span>
          </div>
        </div>
        <div class="stat-footer">
          Total: ${meta.learned} aprendidos · ${meta.catalog} órfãos · ${meta.links} links · ~${totalTokens.toLocaleString("pt-BR")} tokens
          ${generated ? `<br>Gerado: ${generated}` : ""}
        </div>
      `;
    }

    function setHighlightFromNode(node) {
      highlightNodes = new Set([node.id]);
      highlightLinks = new Set();
      const entry = adjacency.get(node.id);
      if (entry) {
        entry.neighbors.forEach((id) => highlightNodes.add(id));
        entry.links.forEach((link) => highlightLinks.add(link));
      }
    }

    function activateNode(node) {
      selectedNode = node;
      setHighlightFromNode(node);
      renderDetail(node);
      Graph.nodeCanvasObjectMode(() => "replace");
    }

    function clearSelection() {
      selectedNode = null;
      highlightNodes = new Set();
      highlightLinks = new Set();
      renderDetail(null);
      Graph.nodeCanvasObjectMode(() => "replace");
    }

    function updateTooltip(node, event) {
      if (!node || selectedNode) {
        tooltipEl.style.display = "none";
        return;
      }
      tooltipEl.textContent = node.name;
      tooltipEl.style.display = "block";
      const stage = document.querySelector(".graph-stage");
      const rect = stage.getBoundingClientRect();
      tooltipEl.style.left = `${event.clientX - rect.left}px`;
      tooltipEl.style.top = `${event.clientY - rect.top}px`;
    }

    function hideTooltip() {
      tooltipEl.style.display = "none";
    }

    function configureLayoutForces(data) {
      const spread = layoutSpread(data.nodes.length);
      Graph.d3Force("link").distance(spread * 0.95).strength(0.22);
      Graph.d3Force("charge").strength(-spread * 2.8);
      const centerForce = Graph.d3Force("center");
      if (centerForce?.strength) {
        centerForce.strength(0.04);
      }
    }

    function scheduleFitView() {
      if (fitPending) return;
      fitPending = true;
      requestAnimationFrame(() => {
        fitPending = false;
        Graph.zoomToFit(400, 48);
      });
    }

    function refreshGraph() {
      const previousId = selectedNode?.id;
      const data = filteredData();
      data.nodes.forEach((node) => {
        delete node.fx;
        delete node.fy;
      });

      buildAdjacency(data.links);
      computeLabelPriority(data.nodes, data.links);
      updateStats(data);
      seedMindMapPositions2D(data.nodes, data.links);

      Graph.graphData(data);
      configureLayoutForces(data);
      Graph.d3ReheatSimulation();

      if (previousId) {
        const stillThere = data.nodes.find((n) => n.id === previousId);
        if (stillThere) {
          activateNode(stillThere);
        } else {
          clearSelection();
        }
      } else {
        clearSelection();
      }
    }

    const Graph = ForceGraph()(document.getElementById("graph"))
      .backgroundColor("#000000")
      .nodeId("id")
      .nodeRelSize(1)
      .nodeVal((node) => nodeRadius(node))
      .nodeCanvasObject(paintNode)
      .nodeCanvasObjectMode(() => "replace")
      .nodePointerAreaPaint(paintPointerArea)
      .linkColor(linkColor)
      .linkWidth(linkWidth)
      .linkDirectionalParticles(0)
      .cooldownTicks(250)
      .d3VelocityDecay(0.35)
      .d3AlphaDecay(0.028)
      .enableNodeDrag(true)
      .onNodeClick((node) => activateNode(node))
      .onNodeHover((node, prevNode) => {
        hoverNode = node || null;
        if (node) {
          Graph.nodeCanvasObjectMode(() => "replace");
        } else if (!prevNode) {
          Graph.nodeCanvasObjectMode(() => "replace");
        }
      })
      .onBackgroundClick(() => clearSelection())
      .onZoom(({ k }) => {
        currentGlobalScale = k;
      });

    const graphStage = document.querySelector(".graph-stage");
    graphStage.addEventListener("mousemove", (event) => {
      if (hoverNode) updateTooltip(hoverNode, event);
      else hideTooltip();
    });
    graphStage.addEventListener("mouseleave", hideTooltip);

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        Graph.pauseAnimation();
      } else {
        Graph.resumeAnimation();
      }
    });

    btnFit.addEventListener("click", () => Graph.zoomToFit(400, 48));

    function debouncedRefresh() {
      clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(refreshGraph, SEARCH_DEBOUNCE_MS);
    }

    searchInput.addEventListener("input", debouncedRefresh);
    toggleOrphans.addEventListener("change", refreshGraph);
    toggleLearnedOnly.addEventListener("change", refreshGraph);
    toggleHideNames.addEventListener("change", () => {
      Graph.nodeCanvasObjectMode(() => "replace");
    });

    Graph.onEngineStop(scheduleFitView);

    refreshGraph();
  </script>
</body>
</html>
